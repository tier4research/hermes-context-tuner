[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-context-tuner"
version = "0.3.3"
description = "Audit trail and token-budget planning for LLM context compression. See what your agent summarized away and where to find it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Tier 4 Research", email = "mjohnson@novacoresystems.com"}]
keywords = [
    "llm", "ai-agents", "context-window", "context-compression",
    "context-management", "token-budget", "observability",
    "audit-log", "python", "sqlite", "agent-tools", "hermes-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/tier4research/hermes-context-tuner"
Documentation = "https://github.com/tier4research/hermes-context-tuner#readme"
Source = "https://github.com/tier4research/hermes-context-tuner"
Changelog = "https://github.com/tier4research/hermes-context-tuner/blob/main/RELEASE_NOTES.md"
Issues = "https://github.com/tier4research/hermes-context-tuner/issues"

[project.scripts]
hermes-context-tuner = "hermes_context_tuner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_context_tuner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
